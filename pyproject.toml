[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel2-ml-dataset"
version = "0.1.0"
description = "Tools for converting Sentinel-2 cloud mask data into an ML-ready tiled dataset."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]